name: qnd_updater
description: "Flutter plugin for incremental app updates via GitHub Releases."
version: 0.0.1
homepage:

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.3.0
  crypto: ^3.0.7
  http: ^1.6.0
  path: any
  path_provider: ^2.1.5
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.qnd_updater
        pluginClass: QndUpdaterPlugin
      macos:
        pluginClass: QndUpdaterPlugin
      windows:
        pluginClass: QndUpdaterPluginCApi
      linux:
        pluginClass: QndUpdaterPlugin