name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build-android:
    name: Android APK (signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is empty"
            exit 1
          fi
          mkdir -p example/android
          # если мигрировал в p12 — поменяй имя файла тут и в key.properties
          echo "$KEYSTORE_BASE64" | base64 -d > example/android/upload-keystore.jks
          ls -la example/android/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > example/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF
          sed -i 's/=.*/=***/' example/android/key.properties
          cat example/android/key.properties

      - name: Build signed APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify signature
        run: |
          APK=example/build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs "$APK" \
            | grep -i 'SHA-256' | head -n1

      - name: Stage APK
        run: |
          mkdir -p out
          cp example/build/app/outputs/flutter-apk/app-release.apk \
             out/qnd_updater-${{ github.ref_name }}.apk

      - name: Cleanup secrets
        if: always()
        run: rm -f example/android/key.properties example/android/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk


  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        working-directory: example
        run: |
          flutter pub get
          flutter build windows --release

      - name: Stage build output
        shell: bash
        run: |
          mkdir -p out/stage
          cp -R example/build/windows/x64/runner/Release/* out/stage/

      - name: Generate manifest
        shell: bash
        env:
          PLATFORM: windows
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse
          platform = os.environ['PLATFORM']
          tag = os.environ['TAG'].lstrip('v')
          stage = 'out/stage'
          files = []
          for root, _, fs in os.walk(stage):
              for fn in fs:
                  full = os.path.join(root, fn)
                  rel = os.path.relpath(full, stage).replace(os.sep, '/')
                  asset = platform + '__' + urllib.parse.quote(rel, safe='')
                  with open(full, 'rb') as fh:
                      h = hashlib.sha256(fh.read()).hexdigest()
                  files.append({
                      'path': rel,
                      'sha256': h,
                      'size': os.path.getsize(full),
                      'asset': asset,
                  })
          os.makedirs('out', exist_ok=True)
          with open(f'out/manifest-{platform}.json', 'w') as fh:
              json.dump({'version': tag, 'files': files}, fh, indent=2)
          print(f'manifest windows: {len(files)} files')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/


  build-macos-intel:
    name: macOS Intel
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build x86_64
        working-directory: example
        env:
          FLUTTER_XCODE_ARCHS: x86_64
        run: |
          flutter pub get
          flutter build macos --release

      - name: Stage Runner.app
        run: |
          mkdir -p out/app
          cp -R example/build/macos/Build/Products/Release/*.app out/app/Runner.app
          file out/app/Runner.app/Contents/MacOS/*

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: out/app


  build-macos-arm:
    name: macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build arm64
        working-directory: example
        env:
          FLUTTER_XCODE_ARCHS: arm64
        run: |
          flutter pub get
          flutter build macos --release

      - name: Stage Runner.app
        run: |
          mkdir -p out/app
          cp -R example/build/macos/Build/Products/Release/*.app out/app/Runner.app
          file out/app/Runner.app/Contents/MacOS/*

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: out/app


  build-macos-universal:
    name: macOS Universal
    needs: [build-macos-intel, build-macos-arm]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-intel
          path: intel
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm
          path: arm

      - name: Merge with lipo
        run: |
          set -e
          UNIVERSAL="out/universal/Runner.app"
          mkdir -p out/universal
          cp -R arm/Runner.app "$UNIVERSAL"

          MAIN=$(ls "$UNIVERSAL/Contents/MacOS/" | head -n1)
          echo "Main binary: $MAIN"
          lipo -create \
            "arm/Runner.app/Contents/MacOS/$MAIN" \
            "intel/Runner.app/Contents/MacOS/$MAIN" \
            -output "$UNIVERSAL/Contents/MacOS/$MAIN"

          for fw in "$UNIVERSAL/Contents/Frameworks/"*.framework; do
            name=$(basename "$fw" .framework)
            bin="$fw/Versions/A/$name"
            [ -f "$bin" ] || bin="$fw/$name"
            arm_bin="arm/Runner.app/Contents/Frameworks/$name.framework/Versions/A/$name"
            intel_bin="intel/Runner.app/Contents/Frameworks/$name.framework/Versions/A/$name"
            [ -f "$arm_bin" ] || arm_bin="arm/Runner.app/Contents/Frameworks/$name.framework/$name"
            [ -f "$intel_bin" ] || intel_bin="intel/Runner.app/Contents/Frameworks/$name.framework/$name"
            if [ -f "$arm_bin" ] && [ -f "$intel_bin" ]; then
              echo "lipo: $name"
              lipo -create "$arm_bin" "$intel_bin" -output "$bin"
            fi
          done

          lipo -info "$UNIVERSAL/Contents/MacOS/$MAIN"
          file "$UNIVERSAL/Contents/MacOS/$MAIN"

          mkdir -p out
          cd out/universal
          zip -qry "../qnd_updater-${{ github.ref_name }}-macos-universal.zip" Runner.app
          cd ../..

      - name: Generate manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse
          tag = os.environ['TAG'].lstrip('v')
          stage = 'out/universal/Runner.app'
          files = []
          for root, _, fs in os.walk(stage):
              for fn in fs:
                  full = os.path.join(root, fn)
                  rel = os.path.relpath(full, stage).replace(os.sep, '/')
                  asset = 'macos__' + urllib.parse.quote(rel, safe='')
                  with open(full, 'rb') as fh:
                      h = hashlib.sha256(fh.read()).hexdigest()
                  files.append({
                      'path': rel,
                      'sha256': h,
                      'size': os.path.getsize(full),
                      'asset': asset,
                  })
          with open('out/manifest-macos.json', 'w') as fh:
              json.dump({'version': tag, 'files': files}, fh, indent=2)
          print(f'manifest macos: {len(files)} files')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/


  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all

      - name: Show collected files
        run: find all -type f | sort | head -200

      - name: Publish archive release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            all/apk/*.apk
            all/macos/*.zip
            all/windows/manifest-windows.json
            all/macos/manifest-macos.json

      - name: Upload per-file assets (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          manifest=all/windows/manifest-windows.json
          [ -f "$manifest" ] || { echo "no manifest"; exit 0; }

          python3 - <<'PY' > /tmp/windows_assets.txt
          import json, os
          m = json.load(open('all/windows/manifest-windows.json'))
          for f in m['files']:
              src = os.path.join('all/windows/stage', f['path'])
              print(f"{src}\t{f['asset']}")
          PY

          while IFS=$'\t' read -r src name; do
            [ -f "$src" ] || continue
            tmp="/tmp/$(basename "$name")"
            cp "$src" "$tmp"
            gh release upload "${{ github.ref_name }}" "$tmp#$(basename "$name")" --clobber
          done < /tmp/windows_assets.txt

      - name: Upload per-file assets (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          manifest=all/macos/manifest-macos.json
          [ -f "$manifest" ] || { echo "no manifest"; exit 0; }

          python3 - <<'PY' > /tmp/macos_assets.txt
          import json, os
          m = json.load(open('all/macos/manifest-macos.json'))
          for f in m['files']:
              src = os.path.join('all/macos/universal/Runner.app', f['path'])
              print(f"{src}\t{f['asset']}")
          PY

          while IFS=$'\t' read -r src name; do
            [ -f "$src" ] || continue
            tmp="/tmp/$(basename "$name")"
            cp "$src" "$tmp"
            gh release upload "${{ github.ref_name }}" "$tmp#$(basename "$name")" --clobber
          done < /tmp/macos_assets.txt