name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p example/android
          echo "$KEYSTORE_BASE64" | base64 -d > example/android/upload-keystore.jks
          ls -la example/android/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > example/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          cat example/android/key.properties

      - name: Build APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify signature
        run: |
          APK=example/build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs "$APK" | grep -i 'SHA-256'

      - name: Stage APK and zip
        run: |
          mkdir -p dist
          cp example/build/app/outputs/flutter-apk/app-release.apk \
             dist/qnd_updater-${{ github.ref_name }}.apk

          mkdir -p staging/android
          cp example/build/app/outputs/flutter-apk/app-release.apk \
             staging/android/qnd_updater.apk
          cd staging/android
          zip -q ../../dist/qnd_updater-${{ github.ref_name }}-android.zip qnd_updater.apk
          cd ../..
          ls -la dist/

      - name: Cleanup secrets
        if: always()
        run: rm -f example/android/key.properties example/android/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*


  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        working-directory: example
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package zip (portable)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item -Recurse -Force "example/build/windows/x64/runner/Release/*" "dist/windows/"
          Compress-Archive `
            -Path "dist/windows/*" `
            -DestinationPath "dist/qnd_updater-${{ github.ref_name }}-windows.zip" `
            -Force
          Copy-Item `
            "example/build/windows/x64/runner/Release/qnd_updater_example.exe" `
            "dist/qnd_updater-${{ github.ref_name }}-windows.exe" `
            -Force
          Get-ChildItem dist/

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          where.exe makensis
          makensis /VERSION

      - name: Build NSIS installer
        shell: bash
        run: |
          set -e
          VERSION=$(grep '^version:' example/pubspec.yaml \
            | sed 's/version: //' | sed 's/+.*//' | xargs)
          echo "version = $VERSION"

          rm -rf nsis_payload
          mkdir -p nsis_payload
          cp -R example/build/windows/x64/runner/Release/* nsis_payload/

          cat > installer.nsi <<'NSIEOF'
          !include "MUI2.nsh"
          !include "FileFunc.nsh"

          Name "Qnd Updater"
          OutFile "dist\qnd_updater-${REF_NAME}-windows-setup.exe"
          InstallDir "$PROGRAMFILES64\qnd_updater_example"
          InstallDirRegKey HKLM "Software\QndUpdater" "InstallDir"
          RequestExecutionLevel admin
          Unicode true

          !define MUI_ABORTWARNING
          !define MUI_FINISHPAGE_RUN "$INSTDIR\qnd_updater_example.exe"
          !define MUI_FINISHPAGE_RUN_TEXT "Запустить Qnd Updater"

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES

          !insertmacro MUI_LANGUAGE "English"
          !insertmacro MUI_LANGUAGE "Russian"

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "nsis_payload\*.*"

            CreateDirectory "$SMPROGRAMS\Qnd Updater"
            CreateShortcut "$SMPROGRAMS\Qnd Updater\Qnd Updater.lnk" "$INSTDIR\qnd_updater_example.exe"
            CreateShortcut "$SMPROGRAMS\Qnd Updater\Удалить.lnk" "$INSTDIR\uninstall.exe"
            CreateShortcut "$DESKTOP\Qnd Updater.lnk" "$INSTDIR\qnd_updater_example.exe"

            WriteUninstaller "$INSTDIR\uninstall.exe"

            WriteRegStr HKLM "Software\QndUpdater" "InstallDir" "$INSTDIR"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\QndUpdater" "DisplayName" "Qnd Updater"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\QndUpdater" "DisplayVersion" "${VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\QndUpdater" "UninstallString" "$INSTDIR\uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\QndUpdater" "DisplayIcon" "$INSTDIR\qnd_updater_example.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\QndUpdater" "Publisher" "Qnd Updater"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\QndUpdater" "InstallLocation" "$INSTDIR"
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\QndUpdater" "NoModify" 1
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\QndUpdater" "NoRepair" 1
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\Qnd Updater.lnk"
            Delete "$SMPROGRAMS\Qnd Updater\Qnd Updater.lnk"
            Delete "$SMPROGRAMS\Qnd Updater\Удалить.lnk"
            RMDir "$SMPROGRAMS\Qnd Updater"
            RMDir /r "$INSTDIR"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\QndUpdater"
            DeleteRegKey HKLM "Software\QndUpdater"
          SectionEnd
          NSIEOF

          # Ищем makensis в нескольких местах
          MAKENSIS=""
          if command -v makensis >/dev/null 2>&1; then
            MAKENSIS=$(command -v makensis)
          elif [ -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          elif [ -f "/c/Program Files/NSIS/makensis.exe" ]; then
            MAKENSIS="/c/Program Files/NSIS/makensis.exe"
          elif [ -f "/c/ProgramData/chocolatey/bin/makensis.exe" ]; then
            MAKENSIS="/c/ProgramData/chocolatey/bin/makensis.exe"
          fi

          if [ -z "$MAKENSIS" ]; then
            echo "=== makensis not found, searching ==="
            find /c/ProgramData/chocolatey -name "makensis.exe" 2>/dev/null || true
            find "/c/Program Files" -name "makensis.exe" 2>/dev/null || true
            exit 1
          fi

          echo "using makensis: $MAKENSIS"
          "$MAKENSIS" -V2 /DREF_NAME="${{ github.ref_name }}" /DVERSION="$VERSION" installer.nsi

          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*


  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglu1-mesa wget imagemagick

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux
        working-directory: example
        run: |
          flutter pub get
          flutter build linux --release

      - name: Write version file
        run: |
          VERSION=$(grep '^version:' example/pubspec.yaml \
            | sed 's/version: //' | sed 's/+.*//' | xargs)
          echo "writing version=$VERSION"
          echo "$VERSION" > example/build/linux/x64/release/bundle/version
          cat example/build/linux/x64/release/bundle/version

      - name: Package zip (auto-updater)
        run: |
          mkdir -p dist
          cd example/build/linux/x64/release/bundle
          zip -qry "$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-linux.zip" .
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Build .run installer
        run: |
          set -e
          VERSION=$(grep '^version:' example/pubspec.yaml \
            | sed 's/version: //' | sed 's/+.*//' | xargs)
          echo "version = $VERSION"

          rm -rf /tmp/run_payload
          mkdir -p /tmp/run_payload
          cp -R example/build/linux/x64/release/bundle/* /tmp/run_payload/
          ( cd /tmp/run_payload && tar -czf /tmp/payload.tar.gz . )

          cat > /tmp/installer_header.sh <<'RUNEOF'
          #!/bin/bash
          set -e

          echo "==============================================="
          echo "  Qnd Updater - установка"
          echo "==============================================="
          echo ""

          DEFAULT_DIR="$HOME/.local/share/qnd_updater"

          read -e -p "Куда установить? [$DEFAULT_DIR]: " INSTALL_DIR
          INSTALL_DIR="${INSTALL_DIR:-$DEFAULT_DIR}"
          INSTALL_DIR="${INSTALL_DIR/#\~/$HOME}"

          if [ -e "$INSTALL_DIR" ]; then
            echo ""
            echo "Директория $INSTALL_DIR уже существует."
            read -p "Перезаписать содержимое? [y/N]: " ans
            case "$ans" in
              [yY]*) rm -rf "$INSTALL_DIR" ;;
              *) echo "Отмена."; exit 1 ;;
            esac
          fi

          mkdir -p "$INSTALL_DIR"
          echo "Устанавливаю в $INSTALL_DIR..."

          PAYLOAD_LINE=$(awk '/^__PAYLOAD_BELOW__$/{print NR + 1; exit 0;}' "$0")
          tail -n +$PAYLOAD_LINE "$0" | tar -xz -C "$INSTALL_DIR"

          EXE="$INSTALL_DIR/qnd_updater_example"
          chmod +x "$EXE"

          APPS_DIR="$HOME/.local/share/applications"
          mkdir -p "$APPS_DIR"
          cat > "$APPS_DIR/qnd-updater.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Qnd Updater
          Exec=$EXE
          Icon=$INSTALL_DIR/data/flutter_assets/assets/icon.png
          Categories=Utility;
          Terminal=false
          StartupWMClass=qnd_updater_example
          EOF
          chmod +x "$APPS_DIR/qnd-updater.desktop"

          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          ln -sf "$EXE" "$BIN_DIR/qnd_updater"

          echo ""
          echo "==============================================="
          echo "  Готово"
          echo "==============================================="
          echo "Путь установки: $INSTALL_DIR"
          echo "Запуск: из меню приложений или командой 'qnd_updater'"
          echo ""

          exit 0

          __PAYLOAD_BELOW__
          RUNEOF

          RUN_FILE="$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-linux-setup.run"
          cat /tmp/installer_header.sh /tmp/payload.tar.gz > "$RUN_FILE"
          chmod +x "$RUN_FILE"
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Build AppImage (manual install)
        run: |
          set -e
          BUNDLE=example/build/linux/x64/release/bundle
          APP_NAME=qnd_updater

          wget -q -O /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

          APPDIR=/tmp/${APP_NAME}.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp -R "$BUNDLE"/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Qnd Updater
          Exec=${APP_NAME}
          Icon=${APP_NAME}
          Categories=Utility;
          Terminal=false
          EOF

          if [ -f "$BUNDLE/data/flutter_assets/assets/icon.png" ]; then
            cp "$BUNDLE/data/flutter_assets/assets/icon.png" "$APPDIR/${APP_NAME}.png"
          else
            convert -size 256x256 xc:'#673AB7' "$APPDIR/${APP_NAME}.png" || \
              printf '' > "$APPDIR/${APP_NAME}.png"
          fi

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/qnd_updater_example" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "$APPDIR" \
            "$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-linux.AppImage"

          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Build .deb (Debian/Ubuntu)
        run: |
          set -e
          BUNDLE=example/build/linux/x64/release/bundle
          VERSION=$(grep '^version:' example/pubspec.yaml \
            | sed 's/version: //' | sed 's/+.*//' | xargs)
          PKG=/tmp/qnd-updater_${VERSION}_amd64
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/lib/qnd_updater" "$PKG/usr/bin" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/256x256/apps"

          cp -R "$BUNDLE"/* "$PKG/usr/lib/qnd_updater/"

          cat > "$PKG/usr/bin/qnd_updater" <<'EOF'
          #!/bin/bash
          exec /usr/lib/qnd_updater/qnd_updater_example "$@"
          EOF
          chmod +x "$PKG/usr/bin/qnd_updater"

          cat > "$PKG/usr/share/applications/qnd-updater.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Qnd Updater
          Exec=qnd_updater
          Icon=qnd-updater
          Categories=Utility;
          Terminal=false
          EOF

          if [ -f "$BUNDLE/data/flutter_assets/assets/icon.png" ]; then
            cp "$BUNDLE/data/flutter_assets/assets/icon.png" \
               "$PKG/usr/share/icons/hicolor/256x256/apps/qnd-updater.png"
          else
            convert -size 256x256 xc:'#673AB7' \
              "$PKG/usr/share/icons/hicolor/256x256/apps/qnd-updater.png" || \
              printf '' > "$PKG/usr/share/icons/hicolor/256x256/apps/qnd-updater.png"
          fi

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: qnd-updater
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: efedotof <efedotof@users.noreply.github.com>
          Description: Qnd Updater example application
           Example application demonstrating qnd_updater plugin.
          Depends: libgtk-3-0, libglu1-mesa
          Section: utils
          Priority: optional
          EOF

          dpkg-deb --build "$PKG" \
            "$GITHUB_WORKSPACE/dist/qnd-updater-${VERSION}-linux.deb"

          ls -la "$GITHUB_WORKSPACE/dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*


  build-macos:
    name: macOS Universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build arm64
        working-directory: example
        env:
          FLUTTER_XCODE_ARCHS: arm64
        run: |
          flutter pub get
          flutter build macos --release

      - name: Save arm64 app
        run: |
          mkdir -p /tmp/arm
          cp -R example/build/macos/Build/Products/Release/*.app /tmp/arm/Runner.app

      - name: Clean for x86_64 build
        working-directory: example
        run: |
          flutter clean
          flutter pub get

      - name: Build x86_64
        working-directory: example
        env:
          FLUTTER_XCODE_ARCHS: x86_64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
        run: flutter build macos --release

      - name: Save intel app
        run: |
          mkdir -p /tmp/intel
          cp -R example/build/macos/Build/Products/Release/*.app /tmp/intel/Runner.app

      - name: Merge with lipo
        run: |
          set -e
          U=/tmp/universal/Runner.app
          mkdir -p /tmp/universal
          cp -R /tmp/arm/Runner.app "$U"
          MAIN=$(ls "$U/Contents/MacOS/" | head -n1)
          lipo -create \
            "/tmp/arm/Runner.app/Contents/MacOS/$MAIN" \
            "/tmp/intel/Runner.app/Contents/MacOS/$MAIN" \
            -output "$U/Contents/MacOS/$MAIN"
          for fw in "$U/Contents/Frameworks/"*.framework; do
            name=$(basename "$fw" .framework)
            bin="$fw/Versions/A/$name"
            [ -f "$bin" ] || bin="$fw/$name"
            a="/tmp/arm/Runner.app/Contents/Frameworks/$name.framework/Versions/A/$name"
            i="/tmp/intel/Runner.app/Contents/Frameworks/$name.framework/Versions/A/$name"
            if [ -f "$a" ] && [ -f "$i" ]; then
              lipo -create "$a" "$i" -output "$bin"
            fi
          done
          lipo -info "$U/Contents/MacOS/$MAIN"

      - name: Write entitlements file
        run: |
          cat > /tmp/release.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.network.client</key>
              <true/>
          </dict>
          </plist>
          EOF
          cat /tmp/release.entitlements

      - name: Remove old signatures
        run: |
          find /tmp/universal/Runner.app -type d -name "_CodeSignature" -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Sign app with release entitlements
        run: |
          codesign --force --deep --sign - \
            --entitlements /tmp/release.entitlements \
            /tmp/universal/Runner.app
          echo "=== verify ==="
          codesign --verify --verbose=2 /tmp/universal/Runner.app
          echo "=== entitlements ==="
          codesign -d --entitlements - /tmp/universal/Runner.app

      - name: Package zip with ditto (preserves xattrs)
        run: |
          mkdir -p dist
          cd /tmp/universal
          ditto -c -k --rsrc --extattr --keepParent Runner.app \
            "$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-macos.zip"
          cd "$GITHUB_WORKSPACE"
          ls -la dist/

      - name: Verify zip contents
        run: |
          set -e
          rm -rf /tmp/verify_zip
          mkdir -p /tmp/verify_zip
          cd /tmp/verify_zip
          unzip -q "$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-macos.zip"
          echo "=== extracted structure ==="
          ls -la
          echo "=== verify signature after unpack ==="
          codesign --verify --verbose=2 Runner.app
          echo "=== entitlements after unpack ==="
          codesign -d --entitlements - Runner.app

      - name: Package dmg (hidden app + install script)
        run: |
          set -e
          rm -rf /tmp/dmg
          mkdir -p /tmp/dmg/.payload

          /usr/bin/ditto /tmp/universal/Runner.app \
            /tmp/dmg/.payload/qnd_updater_example.app

          ln -s /Applications /tmp/dmg/Applications

          cat > /tmp/dmg/Установить.command <<'SCRIPT'
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          APP_SRC="$DIR/.payload/qnd_updater_example.app"
          APP_DEST="/Applications/qnd_updater_example.app"

          echo "==> Устанавливаю qnd_updater_example..."
          rm -rf "$APP_DEST"
          /usr/bin/ditto "$APP_SRC" "$APP_DEST"
          /usr/bin/xattr -cr "$APP_DEST"
          echo "==> Готово. Запускаю..."
          open "$APP_DEST"
          SCRIPT
          chmod +x /tmp/dmg/Установить.command

          cat > /tmp/dmg/ПРОЧТИ_МЕНЯ.txt <<'README'
          Установка приложения
          ====================

          1. Кликните ПРАВОЙ кнопкой мыши по файлу "Установить.command".
          2. Выберите "Открыть" в контекстном меню.
          3. В появившемся диалоговом окне нажмите "Открыть" ещё раз.
             (это стандартное предупреждение macOS для скриптов из
             интернета — оно появляется ОДИН раз)
          4. Скрипт сам скопирует приложение в /Applications
             и запустит его.

          После этого приложение можно запускать двойным кликом
          как обычно. Обновления устанавливаются автоматически.
          README

          SetFile -a V /tmp/dmg/.payload || true

          hdiutil create \
            -volname "qnd_updater ${{ github.ref_name }}" \
            -srcfolder /tmp/dmg \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-macos.dmg"

          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Verify dmg contents
        run: |
          set -e
          rm -rf /tmp/verify_dmg
          mkdir -p /tmp/verify_dmg
          hdiutil attach \
            "$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-macos.dmg" \
            -mountpoint /tmp/verify_dmg -nobrowse
          echo "=== dmg contents ==="
          ls -la /tmp/verify_dmg
          echo "=== .payload contents ==="
          ls -la /tmp/verify_dmg/.payload
          echo "=== verify signature ==="
          codesign --verify --verbose=2 \
            "/tmp/verify_dmg/.payload/qnd_updater_example.app"
          hdiutil detach /tmp/verify_dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*


  release:
    name: Publish release
    needs: [build-android, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: |
          echo "===== collected ====="
          ls -la dist/
          echo "===== by type ====="
          find dist -type f \( -name '*.zip' -o -name '*.apk' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.run' \) -exec ls -la {} \;

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.apk
