name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p example/android
          echo "$KEYSTORE_BASE64" | base64 -d > example/android/upload-keystore.jks
          ls -la example/android/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > example/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          cat example/android/key.properties

      - name: Build APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify signature
        run: |
          APK=example/build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs "$APK" | grep -i 'SHA-256'

      - name: Package Android zip
        run: |
          mkdir -p dist/android
          cp example/build/app/outputs/flutter-apk/app-release.apk dist/android/qnd_updater.apk
          cd dist/android
          zip -q ../qnd_updater-${{ github.ref_name }}-android.zip qnd_updater.apk
          cd ../..
          ls -la dist/

      - name: Cleanup secrets
        if: always()
        run: rm -f example/android/key.properties example/android/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: android-zip
          path: dist/qnd_updater-*-android.zip


  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Build
        working-directory: example
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package zip
        shell: bash
        run: |
          mkdir -p dist/windows
          cp -R example/build/windows/x64/runner/Release/* dist/windows/
          cd dist/windows
          zip -qry ../qnd_updater-${{ github.ref_name }}-windows.zip .
          cd ../..
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/qnd_updater-*-windows.zip


  build-macos:
    name: macOS Universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop

      - name: Build arm64
        working-directory: example
        env:
          FLUTTER_XCODE_ARCHS: arm64
        run: |
          flutter pub get
          flutter build macos --release
      - run: |
          mkdir -p /tmp/arm
          cp -R example/build/macos/Build/Products/Release/*.app /tmp/arm/Runner.app

      - name: Clean and build x86_64
        working-directory: example
        run: |
          flutter clean
          flutter pub get
      - working-directory: example
        env:
          FLUTTER_XCODE_ARCHS: x86_64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
        run: flutter build macos --release
      - run: |
          mkdir -p /tmp/intel
          cp -R example/build/macos/Build/Products/Release/*.app /tmp/intel/Runner.app

      - name: Merge with lipo
        run: |
          set -e
          U=/tmp/universal/Runner.app
          mkdir -p /tmp/universal
          cp -R /tmp/arm/Runner.app "$U"
          MAIN=$(ls "$U/Contents/MacOS/" | head -n1)
          lipo -create \
            "/tmp/arm/Runner.app/Contents/MacOS/$MAIN" \
            "/tmp/intel/Runner.app/Contents/MacOS/$MAIN" \
            -output "$U/Contents/MacOS/$MAIN"
          for fw in "$U/Contents/Frameworks/"*.framework; do
            name=$(basename "$fw" .framework)
            bin="$fw/Versions/A/$name"
            [ -f "$bin" ] || bin="$fw/$name"
            a="/tmp/arm/Runner.app/Contents/Frameworks/$name.framework/Versions/A/$name"
            i="/tmp/intel/Runner.app/Contents/Frameworks/$name.framework/Versions/A/$name"
            if [ -f "$a" ] && [ -f "$i" ]; then
              lipo -create "$a" "$i" -output "$bin"
            fi
          done
          lipo -info "$U/Contents/MacOS/$MAIN"

      - name: Package zip
        run: |
          mkdir -p dist
          cd /tmp/universal
          zip -qry "$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-macos.zip" Runner.app
          ls -la "$GITHUB_WORKSPACE/dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/qnd_updater-*-macos.zip


  release:
    name: Publish release
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show files
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: dist/*.zip