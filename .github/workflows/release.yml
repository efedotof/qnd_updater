name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p example/android
          echo "$KEYSTORE_BASE64" | base64 -d > example/android/upload-keystore.jks
          ls -la example/android/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > example/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          cat example/android/key.properties

      - name: Build APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify signature
        run: |
          APK=example/build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs "$APK" | grep -i 'SHA-256'

      - name: Stage APK and zip
        run: |
          mkdir -p dist
          cp example/build/app/outputs/flutter-apk/app-release.apk \
             dist/qnd_updater-${{ github.ref_name }}.apk

          mkdir -p staging/android
          cp example/build/app/outputs/flutter-apk/app-release.apk \
             staging/android/qnd_updater.apk
          cd staging/android
          zip -q ../../dist/qnd_updater-${{ github.ref_name }}-android.zip qnd_updater.apk
          cd ../..
          ls -la dist/

      - name: Cleanup secrets
        if: always()
        run: rm -f example/android/key.properties example/android/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*


  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        working-directory: example
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item -Recurse -Force "example/build/windows/x64/runner/Release/*" "dist/windows/"
          Compress-Archive `
            -Path "dist/windows/*" `
            -DestinationPath "dist/qnd_updater-${{ github.ref_name }}-windows.zip" `
            -Force
          Copy-Item `
            "example/build/windows/x64/runner/Release/qnd_updater_example.exe" `
            "dist/qnd_updater-${{ github.ref_name }}-windows.exe" `
            -Force
          Get-ChildItem dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*


  build-macos:
    name: macOS Universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop

      - name: Build arm64
        working-directory: example
        env:
          FLUTTER_XCODE_ARCHS: arm64
        run: |
          flutter pub get
          flutter build macos --release

      - name: Save arm64 app
        run: |
          mkdir -p /tmp/arm
          cp -R example/build/macos/Build/Products/Release/*.app /tmp/arm/Runner.app

      - name: Clean for x86_64 build
        working-directory: example
        run: |
          flutter clean
          flutter pub get

      - name: Build x86_64
        working-directory: example
        env:
          FLUTTER_XCODE_ARCHS: x86_64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
        run: flutter build macos --release

      - name: Save intel app
        run: |
          mkdir -p /tmp/intel
          cp -R example/build/macos/Build/Products/Release/*.app /tmp/intel/Runner.app

      - name: Merge with lipo
        run: |
          set -e
          U=/tmp/universal/Runner.app
          mkdir -p /tmp/universal
          cp -R /tmp/arm/Runner.app "$U"
          MAIN=$(ls "$U/Contents/MacOS/" | head -n1)
          lipo -create \
            "/tmp/arm/Runner.app/Contents/MacOS/$MAIN" \
            "/tmp/intel/Runner.app/Contents/MacOS/$MAIN" \
            -output "$U/Contents/MacOS/$MAIN"
          for fw in "$U/Contents/Frameworks/"*.framework; do
            name=$(basename "$fw" .framework)
            bin="$fw/Versions/A/$name"
            [ -f "$bin" ] || bin="$fw/$name"
            a="/tmp/arm/Runner.app/Contents/Frameworks/$name.framework/Versions/A/$name"
            i="/tmp/intel/Runner.app/Contents/Frameworks/$name.framework/Versions/A/$name"
            if [ -f "$a" ] && [ -f "$i" ]; then
              lipo -create "$a" "$i" -output "$bin"
            fi
          done
          lipo -info "$U/Contents/MacOS/$MAIN"

      - name: Package zip (for auto-updater)
        run: |
          mkdir -p dist
          cd /tmp/universal
          zip -qry "$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-macos.zip" Runner.app
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Package dmg (installer)
        run: |
          set -e
          rm -rf /tmp/dmg
          mkdir -p /tmp/dmg
          cp -R /tmp/universal/Runner.app /tmp/dmg/qnd_updater_example.app
          ln -s /Applications /tmp/dmg/Applications

          hdiutil create \
            -volname "qnd_updater ${{ github.ref_name }}" \
            -srcfolder /tmp/dmg \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/dist/qnd_updater-${{ github.ref_name }}-macos.dmg"

          ls -la "$GITHUB_WORKSPACE/dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*


  release:
    name: Publish release
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: |
          echo "===== collected ====="
          ls -la dist/
          echo "===== by type ====="
          find dist -type f \( -name '*.zip' -o -name '*.apk' -o -name '*.exe' -o -name '*.dmg' \) -exec ls -la {} \;

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.apk
            dist/*.exe
            dist/*.dmg